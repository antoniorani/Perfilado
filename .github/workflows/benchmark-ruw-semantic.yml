name: Benchmark RUW pretrained sentence embeddings
on:
  push:
    branches: [feat/ruw-better-classifier]
    paths:
      - scripts/benchmark-ruw-semantic.py
      - .github/workflows/benchmark-ruw-semantic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/benchmark-ruw-data.mjs
      - name: Install ONNX embedding runtime
        run: python3 -m pip install --break-system-packages -q "fastembed>=0.7,<0.9" "scikit-learn>=1.5,<1.9"
      - name: Fit real semantic embedding classification on training data and evaluate DEV
        env:
          OMP_NUM_THREADS: "2"
        run: python3 scripts/benchmark-ruw-semantic.py
      - uses: actions/upload-artifact@v4
        with:
          name: ruw-semantic-validation-benchmark
          path: build/ruw-semantic-results.json
          retention-days: 10

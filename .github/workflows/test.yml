name: Quality checks

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: npm test
      - name: Check browser module syntax
        run: |
          node --check src/core.js
          node --check src/answers.js
          node --check src/face-engine.js
          node --check src/face-pipeline.js
          node --check src/gallery-format.js
          node --check src/step1.js
          node --check src/step2.js
          node --check src/ruw-data.js
          node --check src/text-classifier.js
          node --check src/step3.js
          node --check src/ruw-ridge.js
          node --check scripts/verify-ruw-ridge.mjs
          node --check scripts/verify-ruw.mjs
          node --check scripts/browser-smoke.mjs
          node --check src/full-gallery.js
          node --check scripts/build-gallery.mjs
          node --check scripts/combine-gallery.mjs
          node --check scripts/node-face-model.mjs
          node --check scripts/validate-alignment.mjs
          node --check scripts/evaluate-gallery.mjs

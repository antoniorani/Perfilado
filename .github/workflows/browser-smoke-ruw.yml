name: Browser smoke test RUW

on:
  push:
    branches: [feat/paso3-ruw-textos]
    paths:
      - textos.html
      - src/step3.js
      - assets/textos.css
      - scripts/browser-smoke.mjs
      - .github/workflows/browser-smoke-ruw.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser-test harness only
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static GitHub Pages equivalent
        run: python3 -m http.server 8000 > /tmp/perfilado-http.log 2>&1 &
      - name: Exercise RUW with real data in Chromium
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruw-browser-screenshots
          path: build/ruw-step3-*.png
          retention-days: 7

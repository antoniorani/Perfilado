name: Browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - index.html
      - datos.html
      - src/step1.js
      - src/answers.js
      - assets/styles.css
      - scripts/browser-smoke-step1.mjs
      - textos.html
      - src/step3.js
      - src/semantic-worker.js
      - src/embedding-classifier.js
      - src/text-classifier.js
      - src/ruw-ridge.js
      - data/ruw-joint-ridge-v1.json
      - assets/textos.css
      - scripts/browser-smoke.mjs
      - evaluacion.html
      - assets/evaluacion.css
      - src/step4.js
      - src/combined-risk.js
      - scripts/browser-smoke-step4.mjs
      - .github/workflows/browser-smoke-ruw.yml
  pull_request:
    paths:
      - index.html
      - datos.html
      - src/step1.js
      - src/answers.js
      - assets/styles.css
      - scripts/browser-smoke-step1.mjs
      - textos.html
      - src/step3.js
      - src/semantic-worker.js
      - src/embedding-classifier.js
      - src/text-classifier.js
      - scripts/browser-smoke.mjs
      - evaluacion.html
      - assets/evaluacion.css
      - src/step4.js
      - src/combined-risk.js
      - scripts/browser-smoke-step4.mjs
      - .github/workflows/browser-smoke-ruw.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser-test harness only
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static GitHub Pages equivalent
        run: python3 -m http.server 8000 > /tmp/perfilado-http.log 2>&1 &
      - name: Exercise intro and dataset explorer in Chromium
        run: node scripts/browser-smoke-step1.mjs
      - name: Exercise RUW with real data in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Exercise final evaluation with hypothetical inputs in Chromium
        run: node scripts/browser-smoke-step4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruw-browser-screenshots
          path: |
            build/ruw-step3-*.png
            build/step4-*.png
            build/step1-*.png
          retention-days: 7

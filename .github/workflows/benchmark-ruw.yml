name: Benchmark better RUW classifiers
on:
  push:
    branches: [feat/ruw-better-classifier]
    paths:
      - scripts/benchmark-ruw-data.mjs
      - scripts/benchmark-ruw.py
      - .github/workflows/benchmark-ruw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load real RUW train, dev and test with original browser preprocessing
        run: node scripts/benchmark-ruw-data.mjs
      - name: Install scikit-learn and dependencies
        run: python3 -m pip install --break-system-packages -q "scikit-learn>=1.5,<1.9"
      - name: Compare models on DEV only
        run: python3 scripts/benchmark-ruw.py
      - uses: actions/upload-artifact@v4
        with:
          name: ruw-validation-benchmark
          path: build/ruw-benchmark-results.json
          retention-days: 14
